name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.11"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run synthetic tests without firmware or device access
        run: python -m unittest discover -s tests -v

  intercom-tests:
    name: Intercom lifecycle and browser cancellation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check intercom without HA, network or real media
        run: |
          python -m unittest discover -s integrations/show5-intercom/tests -v
          node --check integrations/show5-intercom/www/show5-intercom-card.js
          node integrations/show5-intercom/tests/test_frontend.cjs
          node integrations/show5-intercom/tests/test_readiness.cjs
          node integrations/show5-intercom/tests/test_duplicate_import.cjs
          node integrations/show5-intercom/tests/test_call_panel.cjs
