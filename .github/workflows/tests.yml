name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.11"]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run synthetic tests without firmware or device access
        run: python -m unittest discover -s tests -v

  intercom-tests:
    name: Intercom lifecycle and browser cancellation
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Check intercom without HA, network or real media
        run: |
          python -m unittest discover -s integrations/show5-intercom/tests -v
          node --check integrations/show5-intercom/www/show5-intercom-card.js
          node --input-type=module --check < integrations/show5-intercom/www/show5-call-panel.js
          node integrations/show5-intercom/tests/test_frontend.cjs
          node integrations/show5-intercom/tests/test_readiness.cjs
          node integrations/show5-intercom/tests/test_duplicate_import.cjs
          node integrations/show5-intercom/tests/test_call_panel.cjs

  display-tests:
    name: Clock, motion and native authentication
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Test synthetic display lifecycle without HA or cameras
        run: |
          node --test integrations/show5-display/tests/*.cjs
          python -m unittest discover -s integrations/show5-display/tests -p 'test_*.py' -v

  fcc-voice-tests:
    name: FCC voice protocol and failure handling
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install bridge dependencies
        run: python -m pip install --require-hashes -r integrations/fcc-voice-backup/requirements.txt
      - name: Test synthetic protocol exchanges without HA or provider access
        run: python -m unittest discover -s integrations/fcc-voice-backup/tests -p test_bridge.py -v

  fcc-cloud-speech-tests:
    name: FCC cloud audio protocol and failure handling
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install cloud adapter dependencies
        run: python -m pip install --require-hashes -r integrations/fcc-voice-backup/cloud-requirements.txt
      - name: Test Wyoming and local fake gRPC without provider access
        run: python -m unittest discover -s integrations/fcc-voice-backup/tests -p test_cloud_speech.py -v

  voice-runtime-tests:
    name: Native voice routing and explicit target responses
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install isolated conversation runtime
        run: python -m pip install --require-hashes -r tests/requirements-voice.txt
      - name: Test native script routing without devices or provider access
        run: |
          PYTHONPATH=tests python -c 'import test_voice_controls; assert test_voice_controls.HA_AVAILABLE, "HA runtime dependencies must be available"'
          python -m unittest discover -s tests -p test_voice_controls.py -v
