name: Tests
'on':
  workflow_call: {}
permissions:
  contents: read
jobs:
  android-source-builds:
    uses: ./.github/workflows/android-source-builds.yml
    permissions:
      contents: read
  browser-compatibility:
    name: Clock and authentication browser acceptance
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/typescript-ci.yml@e71559f44e41f39ad0037bf13c7f43bbbb2ec9af # main
    permissions:
      contents: read
    with:
      node-version: '22'
      run-node-ci: false
      browser-matrix-file: .github/browser-compatibility.json
      browser-prepare-command: node --check scripts/browser-acceptance.cjs
      browser-test-command: node scripts/browser-acceptance.cjs
      browser-extended: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.channel == '') }}
  unit-tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.8'
          - '3.11'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run synthetic tests without firmware or device access
        run: python -m unittest discover -s tests -v
      - name: Check documentation links and SVG accessibility offline
        run: python scripts/check_docs.py
      - name: Check dual-wake build provenance without Android or devices
        run: python -m unittest discover -s integrations/vaca-dual-wake/tests -v
    timeout-minutes: 30
  intercom-tests:
    name: Intercom lifecycle and browser cancellation
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check intercom without HA, network or real media
        run: 'python -m unittest discover -s integrations/show5-intercom/tests -v

          node --check integrations/show5-intercom/www/show5-intercom-card.js

          node --input-type=module --check < integrations/show5-intercom/www/show5-call-panel.js

          node integrations/show5-intercom/tests/test_frontend.cjs

          node integrations/show5-intercom/tests/test_readiness.cjs

          node integrations/show5-intercom/tests/test_duplicate_import.cjs

          node integrations/show5-intercom/tests/test_call_panel.cjs

          '
    timeout-minutes: 30
  display-tests:
    name: Clock, motion and native authentication
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Test synthetic display lifecycle without HA or cameras
        run: 'node --test integrations/show5-display/tests/*.cjs

          python -m unittest discover -s integrations/show5-display/tests -p ''test_*.py'' -v

          '
    timeout-minutes: 30
  fcc-voice-tests:
    name: FCC voice protocol and failure handling
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install bridge dependencies
        run: python -m pip install --require-hashes -r integrations/fcc-voice-backup/requirements.txt
      - name: Test synthetic protocol exchanges without HA or provider access
        run: python -m unittest discover -s integrations/fcc-voice-backup/tests -p test_bridge.py -v
    timeout-minutes: 30
  fcc-cloud-speech-tests:
    name: FCC cloud audio protocol and failure handling
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install cloud adapter dependencies
        run: python -m pip install --require-hashes -r integrations/fcc-voice-backup/cloud-requirements.txt
      - name: Test Wyoming and local fake gRPC without provider access
        run: python -m unittest discover -s integrations/fcc-voice-backup/tests -p test_cloud_speech.py -v
    timeout-minutes: 30
  fcc-container-tests:
    name: Locked FCC image (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: conversation
            dockerfile: Dockerfile
            test-pattern: test_bridge.py
          - service: cloud-audio
            dockerfile: Dockerfile.cloud
            test-pattern: test_cloud_speech.py
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test the pinned image without devices or providers
        working-directory: integrations/fcc-voice-backup
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          TEST_PATTERN: ${{ matrix.test-pattern }}
        run: "docker build --file \"$DOCKERFILE\" --tag fcc-runtime-check .\ndocker run --rm --network none --entrypoint python fcc-runtime-check -m pip check\ndocker run --rm --network none --read-only --tmpfs /tmp \\\n  --mount \"type=bind,source=$PWD/tests,target=/app/tests,readonly\" \\\n  --entrypoint python fcc-runtime-check \\\n  -m unittest discover -s /app/tests -p \"$TEST_PATTERN\" -v\n"
  voice-runtime-tests:
    name: Native voice routing and explicit target responses
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install isolated conversation runtime
        run: python -m pip install --require-hashes -r tests/requirements-voice.txt
      - name: Test native script routing without devices or provider access
        run: 'PYTHONPATH=tests python -c ''import test_voice_controls; assert test_voice_controls.HA_AVAILABLE, "HA runtime dependencies must be available"''

          python -m unittest discover -s tests -p test_voice_controls.py -v

          '
    timeout-minutes: 30
  ci-gate:
    name: CI gate
    if: ${{ !cancelled() }}
    needs:
      - android-source-builds
      - browser-compatibility
      - unit-tests
      - intercom-tests
      - display-tests
      - fcc-voice-tests
      - fcc-cloud-speech-tests
      - fcc-container-tests
      - voice-runtime-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Require every test job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: "python3 - <<'PY'\nimport json\nimport os\n\nresults = json.loads(os.environ[\"JOB_RESULTS\"])\nfailures = {name: job[\"result\"] for name, job in results.items()\n            if job[\"result\"] != \"success\"}\nif failures:\n    raise SystemExit(f\"Required tests did not pass: {failures}\")\nprint(\"All test jobs passed.\")\nPY\n"
