name: Build release assets
'on':
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
      release_plan_artifact:
        description: Frozen version plan allocated by the release workflow
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  package:
    outputs:
      browser-artifact-id: ${{ steps.assets.outputs.artifact-id }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'),
      github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS
      || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Download frozen release version plan
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ${{ inputs.release_plan_artifact }}
        path: .
    - name: Apply frozen release version inputs
      run: python3 scripts/version_plan.py sync --root . --plan .release-plan.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
    - name: Build and verify the exact integration-source archive
      env:
        VERSION: ${{ inputs.version }}
        CHANNEL: ${{ inputs.channel }}
      run: python3 scripts/package_source.py "$VERSION" "$CHANNEL"
    - name: Verify all artifact checksums
      working-directory: release-dist
      run: sha256sum --check SHA256SUMS
    - name: Verify and stage versioned release assets
      run: python3 scripts/stage_release_assets.py --target package --pattern 'release-dist/*'
    - name: Bind browser candidate to the exact source and run
      run: python3 scripts/browser_candidate.py seal release-assets/package
    - id: assets
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: release-assets
        path: release-assets/package/*
        if-no-files-found: error
        retention-days: 14

  browser-release:
    needs: package
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/typescript-ci.yml@5b72b09e8a6bf17b482124891f17fd9662182bf6
    permissions:
      contents: read
      actions: read
    with:
      node-version: '22'
      run-node-ci: false
      browser-matrix-file: .github/browser-compatibility.json
      browser-release-channel: ${{ inputs.channel }}
      browser-extended: ${{ inputs.channel == 'rc' || inputs.channel == 'stable' }}
      browser-evidence-prefix: browser-release
      browser-artifact-id: ${{ needs.package.outputs.browser-artifact-id }}
      browser-artifact-path: browser-candidate
      browser-prepare-command: python3 scripts/browser_candidate.py prepare browser-candidate
      browser-test-command: node scripts/browser-acceptance.cjs
