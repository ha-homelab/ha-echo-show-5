version: 2
updates:
  - package-ecosystem: docker
    directory: /host/synology
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /integrations/fcc-voice-backup
    schedule:
      interval: daily

  - package-ecosystem: pip
    directory: /integrations/fcc-voice-backup
    schedule:
      interval: daily
    # Runtime bindings and the isolated maintenance generator are reviewed together.
    # Regeneration must preserve the pinned complete wire descriptors.
    groups:
      riva-protocol-bindings:
        patterns:
          - grpcio
          - grpcio-tools
          - protobuf
          - setuptools
  # Renovate owns CI updates. The ignore rule also prevents separate
  # Dependabot security-update PRs; vulnerability alerts remain enabled.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'
