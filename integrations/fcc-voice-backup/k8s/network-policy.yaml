# Gateway ingress only. Each Wyoming workload manifest contains its own ingress policy.
# Requires a CNI that enforces Kubernetes NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fcc-voice-gateway-ingress
  namespace: homeassistant
spec:
  podSelector:
    matchLabels:
      app: fcc-voice-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        # Without namespaceSelector this peer is confined to this namespace.
        - podSelector:
            matchLabels:
              app: fcc-voice-bridge
      ports:
        - protocol: TCP
          port: 8082
