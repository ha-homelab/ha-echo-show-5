<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; media-src 'self' blob:; img-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'; worker-src 'self'">
  <title>Clock</title>
  <link rel="stylesheet" href="display.css?v=20261029-r15">
  <script src="config.js?v=20261029-r15" defer></script>
  <script src="i18n.js?v=20261029-r15" defer></script>
  <script src="room.js?v=20261029-r15" defer></script>
  <script src="stream.js?v=20261029-r15" defer></script>
  <script src="auth.js?v=20261029-r15" defer></script>
  <script src="display.js?v=20261029-r15" defer></script>
</head>
<body>
  <main id="display" aria-label="Clock and camera">
    <section id="clock-view" aria-label="Clock">
      <img id="room-photo" alt="" hidden>
      <button id="room-toggle" type="button" aria-controls="room-panel" aria-expanded="false" hidden>Room</button>
      <p id="room-network" role="status" hidden></p>
      <time id="clock-time">--:--</time>
      <p id="clock-date"></p>
      <p id="room-timer" role="status" hidden></p>
      <section id="room-panel" aria-label="Room" hidden>
        <header><h1 id="room-title">Room</h1><button id="room-close" type="button">Clock</button></header>
        <div id="room-readings"></div>
        <div id="room-actions"></div>
        <div id="room-local-timers"><span id="room-local-label">Local timer</span></div>
        <p id="room-timer-note"></p>
        <p id="room-action-status" role="status"></p>
      </section>
      <aside id="room-reminder" hidden><p id="room-reminder-text"></p><button id="room-dismiss" type="button">Dismiss</button></aside>
    </section>
    <section id="camera-view" aria-label="Camera" hidden>
      <div class="camera-frame">
        <img id="camera-image" alt="Camera image" decoding="async" draggable="false" hidden>
        <video id="camera-video" aria-label="Camera video" autoplay muted playsinline poster="blank-video.svg?v=20261029-r15" disableremoteplayback hidden></video>
        <p id="camera-status" hidden></p>
      </div>
    </section>
  </main>
</body>
</html>
