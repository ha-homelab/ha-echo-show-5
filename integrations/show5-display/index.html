<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; media-src 'self' blob:; img-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'; worker-src 'self'">
  <title>Clock</title>
  <link rel="stylesheet" href="display.css?v=20261117-r18">
  <script src="config.js?v=20261117-r18" defer></script>
  <script src="i18n.js?v=20261117-r18" defer></script>
  <script src="room.js?v=20261117-r18" defer></script>
  <script src="stream.js?v=20261117-r18" defer></script>
  <script src="auth.js?v=20261117-r18" defer></script>
  <script src="liquid-clock.js?v=20261117-r18" defer></script>
  <script src="display.js?v=20261117-r18" defer></script>
</head>
<body>
  <main id="display" aria-label="Clock and camera">
    <section id="clock-view" aria-label="Clock">
      <img id="room-photo" alt="" hidden>
      <button id="room-toggle" type="button" aria-controls="room-panel" aria-expanded="false" hidden>Room</button>
      <p id="room-network" role="status" hidden></p>
      <div id="clock-face">
        <time id="clock-time"><span id="clock-label">--:--</span><canvas id="liquid-clock" width="800" height="260" aria-hidden="true"></canvas></time>
        <span id="clock-period" aria-hidden="true"></span>
      </div>
      <div id="clock-date">
        <p id="clock-date-label"></p>
        <div id="liquid-calendar" aria-hidden="true">
          <span id="clock-calendar-day"></span>
          <div class="calendar-copy">
            <strong id="clock-calendar-weekday"></strong>
            <span id="clock-calendar-month"></span>
          </div>
          <div class="second-orbit">
            <svg viewBox="0 0 64 64" focusable="false">
              <defs>
                <linearGradient id="orbit-colour" x1="0%" y1="100%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#f18fe9"/>
                  <stop offset="48%" stop-color="#8fa6ff"/>
                  <stop offset="100%" stop-color="#78fce7"/>
                </linearGradient>
              </defs>
              <circle class="orbit-track" cx="32" cy="32" r="28" pathLength="60" stroke-dasharray=".32 .68"/>
              <circle class="orbit-rail" cx="32" cy="32" r="24"/>
              <circle id="clock-seconds-arc" cx="32" cy="32" r="24" pathLength="60" stroke-dasharray="0 60"
                stroke="url(#orbit-colour)" transform="rotate(-90 32 32)"/>
            </svg>
            <span id="clock-seconds-number">00</span>
          </div>
        </div>
      </div>
      <p id="room-timer" role="status" hidden></p>
      <button id="clock-style" type="button" hidden><span class="clock-style-mark" aria-hidden="true"></span><span id="clock-style-name"></span></button>
      <section id="room-panel" aria-label="Room" hidden>
        <header><h1 id="room-title">Room</h1><button id="room-close" type="button">Clock</button></header>
        <div id="room-readings"></div>
        <div id="room-actions"></div>
        <div id="room-local-timers"><span id="room-local-label">Local timer</span></div>
        <p id="room-timer-note"></p>
        <p id="room-action-status" role="status"></p>
      </section>
      <aside id="room-reminder" hidden><p id="room-reminder-text"></p><button id="room-dismiss" type="button">Dismiss</button></aside>
    </section>
    <section id="camera-view" aria-label="Camera" hidden>
      <div class="camera-frame">
        <img id="camera-image" alt="Camera image" decoding="async" draggable="false" hidden>
        <video id="camera-video" aria-label="Camera video" autoplay muted playsinline poster="blank-video.svg?v=20261117-r18" disableremoteplayback hidden></video>
        <p id="camera-status" hidden></p>
      </div>
    </section>
  </main>
</body>
</html>
