<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Echo Show 5 Gen2: preparation and daily use</title>
  <desc id="desc">A temporary Linux USB host prepares and backs up the exact Echo. During daily use, the device connects to Home Assistant over Wi-Fi; speech services may be local or cloud-hosted.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9" fill="#47627d"/></marker></defs>
  <rect width="1000" height="360" rx="18" fill="#f5f8fc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="32" y="42" font-size="25" font-weight="700" fill="#122b45">Echo Show 5 Gen2: preparation and daily use</text>
    <text x="32" y="70" font-size="15" fill="#47627d">LineageOS / Android path — model-specific cronos conversion</text>
    <g fill="#ffffff" stroke="#b7c9da" stroke-width="1.5"><rect x="32" y="132" width="268" height="139" rx="12"/><rect x="366" y="132" width="268" height="139" rx="12"/><rect x="700" y="132" width="268" height="139" rx="12"/></g>
    <g font-size="13" font-weight="700" fill="#126c96"><text x="50" y="156">PREPARATION</text><text x="384" y="156">DEVICE</text><text x="718" y="156">DAILY SERVICES</text></g>
    <g font-size="20" font-weight="700" fill="#122b45"><text x="50" y="186">Linux USB host</text><text x="384" y="186">Echo Show 5 · cronos</text><text x="718" y="186">Home Assistant</text></g>
    <g font-size="15" fill="#334e68"><text x="50" y="219">Identify · unlock · verify backup</text><text x="50" y="245">Temporary conversion tools</text><text x="384" y="219">Android + Companion</text><text x="384" y="245">Optional VACA voice client</text><text x="718" y="219">Integration + Assist pipeline</text><text x="718" y="245">STT · conversation · TTS</text></g>
    <g fill="none" stroke="#47627d" stroke-width="2" marker-end="url(#arrow)"><path d="M302 204 H358" stroke-dasharray="5 4"/><path d="M641 204 H692" marker-start="url(#arrow)"/></g>
    <g font-size="13" fill="#47627d" text-anchor="middle"><text x="333" y="115">USB</text><text x="667" y="115">Wi-Fi</text></g>
    <text x="32" y="310" font-size="15" fill="#334e68">USB: conversion and maintenance. Daily use: normal power and Wi-Fi.</text>
    <text x="32" y="336" font-size="14" fill="#47627d">Speech services can be local or cloud-hosted. Follow the runbook; this is an architecture map, not a benchmark.</text>
  </g>
</svg>
